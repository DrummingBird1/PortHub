name: Release

# Builds installers for a tag and attaches them to a DRAFT GitHub Release.
# A maintainer reviews and publishes the draft by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf file
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: PortHub v__VERSION__
          releaseDraft: true
          prerelease: true
          args: --bundles ${{ matrix.bundles }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Add SHA256SUMS to the draft release
        run: |
          version=$(gh api repos/${{ github.repository }}/contents/package.json -q .content | base64 -d | jq -r .version)
          mkdir assets && cd assets
          gh release download "v$version" -R ${{ github.repository }} -p "PortHub_${version}_*"
          # Stable names so README links to /releases/latest/download/<name> keep working.
          cp PortHub_${version}_x64-setup.exe PortHub-windows-x64-setup.exe
          cp PortHub_${version}_amd64.AppImage PortHub-linux-x86_64.AppImage
          cp PortHub_${version}_amd64.deb PortHub-linux-amd64.deb
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "v$version" PortHub-windows-x64-setup.exe PortHub-linux-x86_64.AppImage PortHub-linux-amd64.deb SHA256SUMS --clobber -R ${{ github.repository }}
